spring.config.import=optional:file:.env[.properties]
server.port=${PORT:3000}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:blood_bank_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_key_at_least_32_chars}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}
spring.jackson.serialization.write-dates-as-timestamps=false
